
# Change these values to configure what is plotted from the csv

# Time range filter (applied to all plots)
# Format: [start, stop] ['2024-05-01 00:00:00', '2025-10-01 00:00:00']

time_range = ['2024-05-01 00:00:00', '2025-10-01 00:00:00']

# plot all modules for the specified time range (very busy plot, not that useful)
run_all = false

# plot only the modules listed by name in specific_modules (this one probably has the most functionality)
plot_specific_modules = false

# plot all of bpix or fpix for convenience
plot_all_bpix = false
plot_all_fpix = false

# Plot BPix modules by string filters
bpix_by_string_filters = true

# Plot FPix modules by string filters
fpix_by_string_filters = true


specific_modules = [
    'BPix_BpI_SEC3_LAY14_LAY4_HV',
    'BPix_BmO_SEC4_LAY23_LAY3_HV',
    'FPix_BmO_D1_ROG2_RNG2_HV',
    'FPix_BmO_D1_ROG3_RNG1_HV',
    'BPix_BpI_SEC1_LAY14_LAY4_HV',
    'FPix_BmI_D3_ROG4_RNG1_HV',
]


# Naming convention: BPix_BmI_SEC1_LAY14_LAY1_HV
# pos_1 = 'BmI', pos_2 = 'SEC1', pos_3 = 'LAY14', pos_4 = 'LAY1'
[bpix_filters]
pos_1 = ['BmI']
pos_2 = ['SEC1']
pos_3 = ['LAY14', 'LAY23']
pos_4 = ['LAY1', 'LAY1', 'LAY2', 'LAY3', 'LAY4']

# All possible strings: PLEASE KEEP THIS HERE AS A REFERENCE
#   pos_1: ['BmI', 'BmO', 'BpI', 'BpO']
#   pos_2: ['SEC1', 'SEC2', 'SEC3', 'SEC4', 'SEC5', 'SEC6', 'SEC7', 'SEC8']
#   pos_3: ['LAY14', 'LAY23']
#   pos_4: ['LAY1', 'LAY2', 'LAY3', 'LAY4']

# Naming convention: FPix_BmI_D1_ROG1_RNG1_HV
# pos_1 = 'BmI', pos_2 = 'D1', pos_3 = 'ROG1', pos_4 = 'RNG1'
[fpix_filters]
pos_1 = ['BmI', 'BmO', 'BpI', 'BpO']
pos_2 = ['D1']
pos_3 = ['ROG1']
pos_4 = ['RNG1']

